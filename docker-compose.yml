# ServiceDesk ПМ — запуск на сервере.
#   1. cp .env.server.example .env   и заполните
#   2. docker compose up -d --build
# Боты включаются переменной COMPOSE_PROFILES в .env (vk, max или vk,max).

x-db-env: &db-env
  DEBUG: "False"
  DB_ENGINE: postgres
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-servicedesk}
  DB_USER: ${POSTGRES_USER:-servicedesk}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}

x-app: &app
  build: .
  image: servicedesk-pm:latest
  env_file: .env
  environment:
    <<: *db-env
  volumes:
    - media:/app/media
  restart: unless-stopped
  depends_on:
    web:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicedesk}
      POSTGRES_USER: ${POSTGRES_USER:-servicedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Веб-портал (gunicorn). Миграции БД применяются автоматически при старте.
  web:
    <<: *app
    environment:
      <<: *db-env
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  # Контроль SLA: напоминания, эскалация, автозакрытие — раз в минуту
  sla:
    <<: *app
    command: ["python", "manage.py", "check_sla", "--loop", "60"]

  vk_bot:
    <<: *app
    command: ["python", "manage.py", "run_vk_bot"]
    profiles: ["vk"]

  max_bot:
    <<: *app
    command: ["python", "manage.py", "run_max_bot"]
    profiles: ["max"]

  # Входная точка: HTTPS-сертификат Let's Encrypt выпускается автоматически
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
