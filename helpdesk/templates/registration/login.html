{% extends "helpdesk/base.html" %}
{% block title %}Вход — ServiceDesk ПМ{% endblock %}
{% block anon %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card shadow-sm p-4" style="width:360px">
    <h1 class="h4 brand mb-1">ServiceDesk ПМ</h1>
    <p class="text-body-secondary small mb-4">ИТ-поддержка ООО «Поисковая машина»</p>
    {% if form.errors %}<div class="alert alert-danger py-2 small">Неверный логин или пароль.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Логин</label>
        <input class="form-control" name="username" id="id_username" autofocus required></div>
      <div class="mb-3"><label class="form-label" for="id_password">Пароль</label>
        <input class="form-control" type="password" name="password" id="id_password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
